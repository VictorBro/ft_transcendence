# Overlay for a host that runs monitoring next to the app: Prometheus,
# Alertmanager, Grafana and the four exporters. They need about 330 to 450 MB
# more than the app alone (docs/operations/deployment.md, "Memory"), so a host
# without that much memory leaves this file out and runs the app alone. The
# primary, trans.vyantares.ch, has it; the Oracle copy, transcendence.dpdns.org,
# does not.
#
#   docker compose -f compose.deploy.yml -f compose.deploy.monitoring.yml up -d
#
# deploy.sh adds it on its own when this file sits next to compose.deploy.yml.
# Without it, grafana does not resolve and Caddy answers 503 at /grafana.

# The same caps as compose.deploy.yml, for the same reason (the Privacy Policy,
# section 5). Repeated because anchors do not cross files:
# scripts/check-monitoring-config.sh fails when a deploy service lacks them.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # The monitoring stack, see docs/operations/monitoring.md and the comments in
  # compose.yml. Always on wherever this file is loaded: no profile. None of
  # these publishes a port: Grafana is reached through caddy at /grafana. The
  # configs are baked into the three images images.yml publishes, so monitoring
  # adds only this file to the host. The exporter pins are copied from
  # compose.yml by hand, like caddy's: scripts/check-monitoring-config.sh fails
  # when the two drift.
  prometheus:
    logging: *logging
    image: ghcr.io/victorbro/ft_transcendence/prometheus:${IMAGE_TAG:-latest}
    environment:
      # The `source` label on every alert: this server's name.
      ALERT_SOURCE: ${SITE_DOMAIN:?set the public hostname, e.g. ft.example.com}
    volumes:
      - prometheus-data:/prometheus
    networks:
      - ft
    mem_limit: 256m
    # A quarter of the default CPU weight: on a shared core, compaction and
    # Grafana's first-boot migration yield to the app. Weight only, never a cap
    # (`cpus` is a hard error on rootless hosts without cpu delegation), and only
    # here, where the daemon is rootful.
    cpu_shares: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  alertmanager:
    logging: *logging
    image: ghcr.io/victorbro/ft_transcendence/alertmanager:${IMAGE_TAG:-latest}
    environment:
      # Optional on purpose: an interpolation error here would stop the whole
      # deploy, app included (deploy.sh runs under set -e). Empty only means
      # alerts are not sent; the container logs say so at start.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      GRAFANA_URL: https://${SITE_DOMAIN:?set the public hostname, e.g. ft.example.com}/grafana
    tmpfs:
      # Owned by nobody, the entrypoint's user, as in compose.yml.
      - /run/alertmanager:uid=65534,gid=65534,mode=0700
    volumes:
      - alertmanager-data:/alertmanager
    networks:
      - ft
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  grafana:
    logging: *logging
    image: ghcr.io/victorbro/ft_transcendence/grafana:${IMAGE_TAG:-latest}
    environment:
      GF_SERVER_ROOT_URL: https://${SITE_DOMAIN:?set the public hostname, e.g. ft.example.com}/grafana/
      # No fallback: a default would be a password published in this repo.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD, see .env.example}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?set GRAFANA_SECRET_KEY, see .env.example}
      GOMEMLIMIT: 256MiB
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - ft
    mem_limit: 320m
    # Same reason as prometheus.
    cpu_shares: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  node-exporter:
    logging: *logging
    image: ghcr.io/prometheus/node-exporter:v1.12.1
    command:
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|etc|var/lib/(docker|containers|containerd)/.+)($$|/)
    volumes:
      - /:/rootfs:ro
    networks:
      - ft
    mem_limit: 48m
    restart: unless-stopped

  postgres-exporter:
    logging: *logging
    image: ghcr.io/prometheus-community/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:-ft_transcendence}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-ft}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?set a real database password}
    networks:
      - ft
    mem_limit: 48m
    restart: unless-stopped

  redis-exporter:
    logging: *logging
    image: ghcr.io/oliver006/redis_exporter:v1.97.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_EXPORTER_COUNT_KEYS: db0=sess:*
    networks:
      - ft
    mem_limit: 32m
    restart: unless-stopped

  blackbox-exporter:
    logging: *logging
    image: ghcr.io/prometheus/blackbox-exporter:v0.29.1
    networks:
      - ft
    mem_limit: 32m
    restart: unless-stopped

# Named like before the split: compose prefixes them with the project name, so
# a host that ran monitoring from compose.deploy.yml keeps its data.
volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
