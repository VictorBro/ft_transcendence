# Production overlay: the artifacts an evaluator runs, and the same ones the
# console gate and Playwright test in CI.
#
#   docker compose -f compose.yml -f compose.prod.yml up -d --build
#
# The -f list is explicit on purpose. Naming any -f suppresses the automatic
# load of compose.override.yml, which is what keeps the dev bind mounts out.
#
# There are no volumes here beyond the ones compose.yml already declares: the
# prod images carry their own build output and run as a non-root user.

services:
  caddy:
    restart: unless-stopped
    # The prod images declare a HEALTHCHECK, so the proxy can wait for a real
    # ready signal instead of "the process started".
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      target: prod
    environment:
      NODE_ENV: production
    restart: unless-stopped

  api:
    build:
      target: prod
    environment:
      NODE_ENV: production
      # No dev fallback here: compose.yml has one, and inheriting it would sign
      # production cookies with a secret that is public in this repo.
      SESSION_SECRET: ${SESSION_SECRET:?set an explicit SESSION_SECRET for production}
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  # Monitoring is part of what an evaluator runs (the Prometheus and Grafana
  # module): same restart policy as the app.
  prometheus:
    restart: unless-stopped

  alertmanager:
    restart: unless-stopped

  grafana:
    environment:
      # No fallback, like SESSION_SECRET. `make` writes both into .env on the
      # first run; CI sets its own in e2e.yml.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make, which writes one into .env, or set GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?run make, which writes one into .env, or set GRAFANA_SECRET_KEY}
    restart: unless-stopped

  node-exporter:
    restart: unless-stopped

  postgres-exporter:
    restart: unless-stopped

  redis-exporter:
    restart: unless-stopped

  blackbox-exporter:
    restart: unless-stopped
