# Shared topology. Nothing dev-specific and nothing prod-specific lives here.
#
#   docker compose up                              -> this + compose.override.yml (dev)
#   docker compose -f compose.yml -f compose.prod.yml up   -> prod
#
# Build targets are set by those overlays, never here: a bare `docker compose
# build` would otherwise pick a stage that is wrong for one of the two.
#
# Every value is `${VAR:-default}` so the stack also comes up with no .env file,
# which is what CI does. Copy .env.example to .env to change any of them.

name: ft_transcendence

services:
  # The only service with published ports. Terminates TLS and routes by path,
  # so web and api share one origin: no CORS, and cookies are first-party.
  caddy:
    image: caddy:2.11.4-alpine
    # Long form even though the condition is the default: compose.prod.yml
    # tightens it to service_healthy, and mixing the short and long forms
    # across overlays is a merge the spec does not define.
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    environment:
      # Extra site address served with the same internal CA, for reaching the
      # stack from another device. See the Caddyfile header and .env.example.
      CADDY_EXTRA_HOSTNAME: ${CADDY_EXTRA_HOSTNAME:-ft-transcendence.test}
    ports:
      # Overridable for hosts that cannot bind ports below 1024 (rootless
      # Docker on a sudo-less school machine): set HTTP_PORT/HTTPS_PORT in
      # .env, e.g. 8080/8443, and open https://localhost:8443 directly. The
      # automatic http->https redirect assumes the default ports, so with
      # overrides just use the https URL.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # HTTP/3. Caddy enables it by default and the browser silently falls back
      # to TCP without this line, which hides the misconfiguration.
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # ${LOCAL_WORKSPACE_FOLDER:-.}: relative bind-mount paths resolve on the
      # docker DAEMON's side, i.e. against the HOST filesystem. From a host
      # shell "." is correct; from the devcontainer it is not, so
      # devcontainer.json injects the host path into container shells and every
      # repo bind mount in these files uses it. Unset (host, CI) it falls back
      # to "." and nothing changes.
      - ${LOCAL_WORKSPACE_FOLDER:-.}/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The internal CA lives in /data. Without this volume every restart mints
      # a new root and the browser warning comes back.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - ft
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # Ordering only. The home page renders an "api unavailable" state rather
    # than failing, so web must not wait for a healthy api.
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # Server components call NestJS over the internal network, plain http:
      # TLS stops at caddy.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
      NEXT_TELEMETRY_DISABLED: 1
    networks:
      - ft

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Prometheus scrapes metrics on 9464 (apps/api/src/metrics). Internal
      # only: never add it to ports.
      PORT: 3001
      # Surfaced by GET /api/health so a running container can be identified.
      APP_VERSION: ${APP_VERSION:-0.0.0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://ft:ft_local_dev@db:5432/ft_transcendence?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-at-least-32-chars}
      LLM_PROVIDER: ${LLM_PROVIDER:-fixture}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Matches the mount below. Not from .env: the target is fixed, so another
      # value would only send uploads off the volume.
      AVATAR_STORAGE_DIR: /data/avatars
    volumes:
      - avatars-data:/data/avatars
    networks:
      - ft

  db:
    # Not the plain `postgres` image: it ships without pgvector. See
    # docs/VERSIONS.md for the CVE that sets the 0.8.6 floor.
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ft_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ft_transcendence}
    volumes:
      # Mounted one level above PGDATA on purpose. The Postgres 18 images moved
      # the data directory to /var/lib/postgresql/18/docker, so a volume at the
      # familiar /var/lib/postgresql/data would hold nothing and every restart
      # would come up empty. The parent path is correct under both layouts.
      - pg-data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 matters: during init the entrypoint runs a temporary server
      # on a unix socket only, and a socket-based pg_isready reports ready before
      # that server accepts TCP.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - ft

  redis:
    image: redis:8.10.1-alpine
    # AOF on: sessions should survive a restart. RDB snapshots
    # alone lose up to a minute of writes.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks:
      - ft

  # The Prometheus and Grafana module, see docs/MONITORING.md.
  # Always on in the prod overlay. compose.override.yml puts these behind the
  # monitoring profile, so `make dev` stays light and `make monitoring-up`
  # opts in. None of these publishes a port: Grafana is reached through caddy
  # at /grafana, everything else only over this network. Their config is baked
  # into the images built here, the same ones images.yml publishes for the
  # server, which has no checkout to bind-mount it from.

  prometheus:
    build:
      context: infra/monitoring/prometheus
    volumes:
      - prometheus-data:/prometheus
    networks:
      - ft
    # Prometheus derives its Go memory limit from this (--auto-gomemlimit).
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  alertmanager:
    build:
      context: infra/monitoring/alertmanager
    environment:
      # Empty: alerts stay visible in Grafana and go nowhere. See .env.example.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # Becomes the link in each Discord message; Alertmanager is never exposed.
      GRAFANA_URL: https://localhost:${HTTPS_PORT:-443}/grafana
    tmpfs:
      # The entrypoint writes the webhook here, so it never lands on a volume.
      - /run/alertmanager
    volumes:
      - alertmanager-data:/alertmanager
    networks:
      - ft
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  grafana:
    build:
      context: infra/monitoring/grafana
    environment:
      # Only shapes absolute links; the dev host names all work regardless.
      GF_SERVER_ROOT_URL: https://localhost:${HTTPS_PORT:-443}/grafana/
      # Grafana ignores an empty GF_ variable and keeps admin/admin, so the
      # image's entrypoint refuses to start without both. make generates them.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:-}
      # Go sizes its heap against this instead of the whole machine.
      GOMEMLIMIT: 256MiB
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - ft
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 30s
      timeout: 5s
      # First boot migrates Grafana's SQLite database.
      start_period: 60s
      retries: 3

  node-exporter:
    image: ghcr.io/prometheus/node-exporter:v1.12.1
    command:
      - --path.rootfs=/rootfs
      # The container's own mounts (/etc/hosts and friends) and the runtimes'
      # layers are not disks. $$ is compose's escape for a literal $.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|etc|var/lib/(docker|containers|containerd)/.+)($$|/)
    volumes:
      # The only host bind. The container's /proc already reports host CPU,
      # memory, load and disk I/O; this adds the root filesystem. Not the
      # upstream recipe: rslave fails on Docker Desktop, and pid: host and host
      # networking are not a given on rootless school machines. The cost is
      # that network metrics describe this container, not the host.
      - /:/rootfs:ro
    networks:
      - ft
    mem_limit: 48m

  postgres-exporter:
    image: ghcr.io/prometheus-community/postgres-exporter:v0.20.1
    environment:
      # The app's role, a superuser, as the API already uses. A pg_monitor role
      # would need a step in migrate and a third secret.
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:-ft_transcendence}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-ft}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-ft_local_dev}
    networks:
      - ft
    mem_limit: 48m

  redis-exporter:
    image: ghcr.io/oliver006/redis_exporter:v1.93.0
    environment:
      REDIS_ADDR: redis://redis:6379
      # Stored sessions, counted by SCAN on each scrape. The prefix is
      # SESSION_KEY_PREFIX in apps/api/src/app.setup.ts.
      REDIS_EXPORTER_COUNT_KEYS: db0=sess:*
    networks:
      - ft
    mem_limit: 32m

  blackbox-exporter:
    # The image's default config has the http_2xx module, which is all the
    # probes in prometheus.yml use.
    image: ghcr.io/prometheus/blackbox-exporter:v0.29.0
    networks:
      - ft
    mem_limit: 32m

volumes:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:
  avatars-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  ft:
    driver: bridge
