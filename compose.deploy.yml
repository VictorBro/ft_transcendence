# Deployment topology: pulls released images, never builds.
#
#   docker compose -f compose.deploy.yml --profile migrate pull
#   docker compose -f compose.deploy.yml --profile migrate run --rm migrate
#   docker compose -f compose.deploy.yml up -d
#
# Standalone on purpose. compose.yml carries `build:` contexts that only make
# sense next to a checkout, so a server that has no repo cannot use it as a base.
# Three files are all a fresh host needs:
#
#   compose.deploy.yml   this file
#   Caddyfile            infra/caddy/Caddyfile.prod, renamed
#   .env                 .env.example from the repo root, filled in
#
# This file is the app alone. Two overlays go next to it when the host needs
# them, and deploy.sh adds each one it finds:
#
#   compose.deploy.monitoring.yml   Prometheus, Alertmanager, Grafana, exporters
#   compose.deploy.proxy.yml        another reverse proxy owns 80 and 443
#
# Everything else arrives from ghcr.io, which serves these packages publicly, so
# the host needs no registry login.

name: ft_transcendence

# Every service logs through Docker's json-file driver, which keeps a log
# forever unless told otherwise. Caddy's access log holds each visitor's IP
# address, and the Privacy Policy (section 5) says those logs are capped and
# rotated out, oldest first: three files of 10 MB per container, at most.
# compose.deploy.monitoring.yml carries its own copy: anchors do not cross files.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    logging: *logging
    image: caddy:2.11.9-alpine
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      # The certificate is issued for this name, so it must resolve publicly to
      # this host before the stack starts.
      SITE_DOMAIN: ${SITE_DOMAIN:?set the public hostname, e.g. ft.example.com}
      # Let's Encrypt emails this address about expiry it could not renew.
      ACME_EMAIL: ${ACME_EMAIL:?set an address for the certificate authority}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The issued certificates live here. Lose it and every restart asks the
      # CA again, which is rate limited to a handful per domain per week.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - ft
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    logging: *logging
    image: ghcr.io/victorbro/ft_transcendence/web:${IMAGE_TAG:-latest}
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:3001
      NEXT_TELEMETRY_DISABLED: 1
    networks:
      - ft
    restart: unless-stopped

  api:
    logging: *logging
    image: ghcr.io/victorbro/ft_transcendence/api:${IMAGE_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_VERSION: ${IMAGE_TAG:-latest}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ft}:${POSTGRES_PASSWORD:?set a real database password}@db:5432/${POSTGRES_DB:-ft_transcendence}?schema=public
      REDIS_URL: redis://redis:6379
      # No fallback: inheriting a default would sign production cookies with a
      # secret that is public in this repo.
      SESSION_SECRET: ${SESSION_SECRET:?set an explicit SESSION_SECRET, at least 32 characters}
      # No fallback: fixture generates no questions, so a learner who has seen a
      # level gets only repeats. It must be an explicit choice, never inherited.
      LLM_PROVIDER: ${LLM_PROVIDER:?set LLM_PROVIDER to fixture, gemini or disabled}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_DISCUSSION_USER_PER_MINUTE: ${LLM_DISCUSSION_USER_PER_MINUTE:-}
      LLM_DISCUSSION_USER_PER_DAY: ${LLM_DISCUSSION_USER_PER_DAY:-}
      LLM_DISCUSSION_GLOBAL_PER_MINUTE: ${LLM_DISCUSSION_GLOBAL_PER_MINUTE:-}
      # Empty keeps the default in apps/api/src/throttler/rate-limits.ts.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-}
      SIGNUP_LIMIT_PER_MINUTE: ${SIGNUP_LIMIT_PER_MINUTE:-}
      LOGIN_LIMIT_PER_MINUTE: ${LOGIN_LIMIT_PER_MINUTE:-}
      AVATAR_STORAGE_DIR: /data/avatars
    volumes:
      - avatars-data:/data/avatars
    networks:
      - ft
    restart: unless-stopped

  # One-shot, behind a profile so `up` never starts it. Runs before the new api
  # does, because a container booting against a schema it predates fails in ways
  # that are harder to read than a failed migration.
  #
  # The build stage of apps/api/Dockerfile, published by images.yml: `prod`
  # deliberately carries no Prisma CLI and no migrations. A stock node image is
  # not a shortcut: the Prisma CLI needs openssl (see apps/api/Dockerfile).
  #
  # Seeds after migrating: the question bank and the lessons ship as files in
  # content/, which the tooling image carries. Both upsert on the authored ids,
  # so running the seed on every deploy is safe. With DEMO_PASSWORD set, the
  # seed then deletes the six demo learners and builds them again, so each
  # deploy resets them and their today is the deploy's. A learner that fails
  # is logged and skipped: it never fails the deploy.
  migrate:
    logging: *logging
    image: ghcr.io/victorbro/ft_transcendence/tooling:${IMAGE_TAG:-latest}
    profiles: [migrate]
    command:
      [
        "sh",
        "-c",
        "pnpm --filter @ft/api exec prisma migrate deploy && pnpm --filter @ft/api run db:seed",
      ]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ft}:${POSTGRES_PASSWORD:?set a real database password}@db:5432/${POSTGRES_DB:-ft_transcendence}?schema=public
      # Empty: no demo learners. Only this one-shot service gets it, never the
      # api (SEED_ONLY in scripts/check-env-example.sh).
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    networks:
      - ft
    restart: "no"

  db:
    logging: *logging
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real database password}
      POSTGRES_DB: ${POSTGRES_DB:-ft_transcendence}
    volumes:
      # One level above PGDATA: Postgres 18 moved the data directory, so a
      # volume at /var/lib/postgresql/data would hold nothing.
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - ft
    restart: unless-stopped

  redis:
    logging: *logging
    image: redis:8.10.3-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks:
      - ft
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:
  avatars-data:

networks:
  ft:
    driver: bridge
