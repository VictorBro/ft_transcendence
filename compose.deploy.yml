# Deployment topology: pulls released images, never builds.
#
#   docker compose -f compose.deploy.yml pull
#   docker compose -f compose.deploy.yml --profile migrate run --rm migrate
#   docker compose -f compose.deploy.yml up -d
#
# Standalone on purpose. compose.yml carries `build:` contexts that only make
# sense next to a checkout, so a server that has no repo cannot use it as a base.
# Three files are all a fresh host needs:
#
#   compose.deploy.yml   this file
#   Caddyfile            infra/caddy/Caddyfile.prod, renamed
#   .env                 see infra/deploy/.env.example
#
# Everything else arrives from ghcr.io, which serves these packages publicly, so
# the host needs no registry login.

name: ft_transcendence

services:
  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      # The certificate is issued for this name, so it must resolve publicly to
      # this host before the stack starts.
      SITE_DOMAIN: ${SITE_DOMAIN:?set the public hostname, e.g. ft.example.com}
      # Let's Encrypt emails this address about expiry it could not renew.
      ACME_EMAIL: ${ACME_EMAIL:?set an address for the certificate authority}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The issued certificates live here. Lose it and every restart asks the
      # CA again, which is rate limited to a handful per domain per week.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - ft
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    image: ghcr.io/victorbro/ft_transcendence/web:${IMAGE_TAG:-latest}
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:3001
      NEXT_TELEMETRY_DISABLED: 1
    networks:
      - ft
    restart: unless-stopped

  api:
    image: ghcr.io/victorbro/ft_transcendence/api:${IMAGE_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_VERSION: ${IMAGE_TAG:-latest}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ft}:${POSTGRES_PASSWORD:?set a real database password}@db:5432/${POSTGRES_DB:-ft_transcendence}?schema=public
      REDIS_URL: redis://redis:6379
      # No fallback: inheriting a default would sign production cookies with a
      # secret that is public in this repo.
      SESSION_SECRET: ${SESSION_SECRET:?set an explicit SESSION_SECRET, at least 32 characters}
      # No fallback: fixture generates no questions, so a learner who has seen a
      # level gets only repeats. It must be an explicit choice, never inherited.
      LLM_PROVIDER: ${LLM_PROVIDER:?set LLM_PROVIDER to fixture or gemini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      AVATAR_STORAGE_DIR: /data/avatars
    volumes:
      - avatars-data:/data/avatars
    networks:
      - ft
    restart: unless-stopped

  # One-shot, behind a profile so `up` never starts it. Runs before the new api
  # does, because a container booting against a schema it predates fails in ways
  # that are harder to read than a failed migration.
  #
  # The build stage of apps/api/Dockerfile, published by images.yml: `prod`
  # deliberately carries no Prisma CLI and no migrations. A stock node image is
  # not a shortcut, see docs/VERSIONS.md trap 1c.
  #
  # Seeds after migrating: the question bank and the lessons ship as files in
  # content/, which the tooling image carries. Both upsert on the authored ids,
  # so running the seed on every deploy is safe.
  migrate:
    image: ghcr.io/victorbro/ft_transcendence/tooling:${IMAGE_TAG:-latest}
    profiles: [migrate]
    command:
      [
        "sh",
        "-c",
        "pnpm --filter @ft/api exec prisma migrate deploy && pnpm --filter @ft/api run db:seed",
      ]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ft}:${POSTGRES_PASSWORD:?set a real database password}@db:5432/${POSTGRES_DB:-ft_transcendence}?schema=public
    networks:
      - ft
    restart: "no"

  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real database password}
      POSTGRES_DB: ${POSTGRES_DB:-ft_transcendence}
    volumes:
      # One level above PGDATA: Postgres 18 moved the data directory, so a
      # volume at /var/lib/postgresql/data would hold nothing.
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - ft
    restart: unless-stopped

  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks:
      - ft
    restart: unless-stopped

  # The monitoring stack, see docs/MONITORING.md and the comments in
  # compose.yml. Always on here. None of these publishes a port: Grafana is
  # reached through caddy at /grafana. The configs are baked into the three
  # images images.yml publishes, so this host still needs only three files. The
  # exporter pins are copied from compose.yml by hand, like caddy's:
  # scripts/check-monitoring-config.sh fails when the two drift.
  prometheus:
    image: ghcr.io/victorbro/ft_transcendence/prometheus:${IMAGE_TAG:-latest}
    volumes:
      - prometheus-data:/prometheus
    networks:
      - ft
    mem_limit: 256m
    # A quarter of the default CPU weight: on a shared core, compaction and
    # Grafana's first-boot migration yield to the app. Weight only, never a cap
    # (`cpus` is a hard error on rootless hosts without cpu delegation), and only
    # here, where the daemon is rootful.
    cpu_shares: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  alertmanager:
    image: ghcr.io/victorbro/ft_transcendence/alertmanager:${IMAGE_TAG:-latest}
    environment:
      # Optional on purpose: an interpolation error here would stop the whole
      # deploy, app included (deploy.sh runs under set -e). Empty only means
      # alerts are not sent; the container logs say so at start.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      GRAFANA_URL: https://${SITE_DOMAIN:?set the public hostname, e.g. ft.example.com}/grafana
    tmpfs:
      - /run/alertmanager
    volumes:
      - alertmanager-data:/alertmanager
    networks:
      - ft
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  grafana:
    image: ghcr.io/victorbro/ft_transcendence/grafana:${IMAGE_TAG:-latest}
    environment:
      GF_SERVER_ROOT_URL: https://${SITE_DOMAIN:?set the public hostname, e.g. ft.example.com}/grafana/
      # No fallback: a default would be a password published in this repo.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD, see infra/deploy/.env.example}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?set GRAFANA_SECRET_KEY, see infra/deploy/.env.example}
      GOMEMLIMIT: 256MiB
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - ft
    mem_limit: 320m
    # Same reason as prometheus.
    cpu_shares: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  node-exporter:
    image: ghcr.io/prometheus/node-exporter:v1.12.1
    command:
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|etc|var/lib/(docker|containers|containerd)/.+)($$|/)
    volumes:
      - /:/rootfs:ro
    networks:
      - ft
    mem_limit: 48m
    restart: unless-stopped

  postgres-exporter:
    image: ghcr.io/prometheus-community/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:-ft_transcendence}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-ft}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?set a real database password}
    networks:
      - ft
    mem_limit: 48m
    restart: unless-stopped

  redis-exporter:
    image: ghcr.io/oliver006/redis_exporter:v1.93.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_EXPORTER_COUNT_KEYS: db0=sess:*
    networks:
      - ft
    mem_limit: 32m
    restart: unless-stopped

  blackbox-exporter:
    image: ghcr.io/prometheus/blackbox-exporter:v0.29.0
    networks:
      - ft
    mem_limit: 32m
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:
  avatars-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  ft:
    driver: bridge
