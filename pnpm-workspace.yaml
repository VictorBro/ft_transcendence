packages:
  - 'apps/*'
  - 'packages/*'
  # Playwright suite. A workspace member so its deps resolve, and so
  # `turbo run lint typecheck` reaches it like every other package.
  - 'e2e'

# typescript-eslint caps at <6.1.0, and @nestjs/cli 12 needs the compiler API,
# which TypeScript 7 drops until 7.1 (docs/VERSIONS.md). The override keeps a
# transitive dependency from pulling a second major in.
overrides:
  typescript: 6.0.3

# pnpm 11 blocks dependency lifecycle scripts unless allow-listed. The pnpm 10
# keys (onlyBuiltDependencies, neverBuiltDependencies, ignoredBuiltDependencies)
# were REMOVED in pnpm 11 and are silently ignored; this map replaces all of them.
allowBuilds:
  # Downloads and places the query engine. Prisma cannot run without it.
  '@prisma/engines': true
  prisma: true
  # Native binary behind unplugin-swc, which vitest needs for decorator metadata.
  '@swc/core': true
  # Installed by next for its image optimiser, which next.config turns off.
  sharp: true
  # Telemetry only. Nothing depends on it functionally, so deny it.
  '@scarf/scarf': false
  # Password hashing: a native addon, built or downloaded at install.
  argon2: true
  '@parcel/watcher': true
  esbuild: true

# pnpm 11 defaults minimumReleaseAge to 1440 minutes: a version published less
# than 24h ago is refused, which blunts npm account-takeover attacks. Keep it on.
# When a pin is newer than that, pnpm adds it to minimumReleaseAgeExclude in
# this file by itself; commit that. With the prune, pnpm add, update and remove
# drop an entry once the lockfile no longer has that version.
minimumReleaseAgeExcludePrune: true

# pnpm's "Update available" box. pnpm moves with packageManager, on purpose,
# and the box only ever pointed at the major docs/VERSIONS.md holds back.
updateNotifier: false
