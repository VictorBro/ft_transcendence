name: ci

# Hybrid by design (TECHNICAL_PLAN.md section 5): checks that only read files run
# natively on the runner, because they are fast and their environment does not
# affect the result. Anything that EXECUTES project code runs inside the `ci`
# Docker stage, so a test passes here for the same reason it passes in prod.
# Once per PR, against the simulated merge with main, and once more when the
# squash merge lands. An unfiltered `push:` would fire a second, near-identical
# run on every PR commit, because a push to a PR branch is also a synchronize.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR runs use refs/pull/N/merge and main uses refs/heads/main, so the two never
# share a group; a new commit only cancels the older run of its own PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # docs/VERSIONS.md trap 1. npm `latest` for typescript is 7.x, which has no
  # decorator support (NestJS will not compile) and violates the
  # typescript-eslint peer range (<6.1.0). One `pnpm up --latest` reintroduces
  # it silently, so this is a first-class gate rather than a comment in a doc.
  ts-version:
    name: typescript is pinned at 6.0.3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: ./scripts/assert-ts-version.sh

  format:
    name: format:check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  # Coverage thresholds live in each vitest config (60% lines, 60% functions)
  # and are a merge blocker: the test command exits non-zero below them, so
  # there is nothing to assert here.
  unit-tests:
    name: unit tests (${{ matrix.app }})
    runs-on: ubuntu-24.04

    # The Supertest suite boots the whole Nest graph, and PrismaService connects
    # during onModuleInit, so it needs a real database. Declared for both matrix
    # legs because `services` is a job-level key; the web leg simply ignores it,
    # which costs a few seconds of container start.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: ft
          POSTGRES_PASSWORD: ft_local_dev
          POSTGRES_DB: ft_transcendence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ft -d ft_transcendence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        include:
          # The image CMD also runs lint and typecheck. It is overridden here so
          # those stay the responsibility of the native jobs above and are not
          # paid for twice.
          - app: api
            command: pnpm --filter @ft/api exec prisma migrate deploy && pnpm --filter @ft/api run test:cov && pnpm --filter @ft/api run test:e2e
          - app: web
            command: pnpm --filter @ft/web run test:cov
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.2.0

      - name: Build the ci stage
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: ci
          load: true
          tags: ft/${{ matrix.app }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.app }}

      - name: Test with coverage
        run: |
          mkdir -p coverage
          # --network host: a `services:` container publishes on the RUNNER, and
          # a plain `docker run` sits on its own bridge network where 127.0.0.1
          # is the container itself.
          docker run --rm \
            --network host \
            -e DATABASE_URL="postgresql://ft:ft_local_dev@127.0.0.1:5432/ft_transcendence?schema=public" \
            -v "$PWD/coverage:/coverage" \
            ft/${{ matrix.app }}:ci \
            sh -c "${{ matrix.command }} && cp -a /app/apps/${{ matrix.app }}/coverage/. /coverage/"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ matrix.app }}
          path: coverage
          if-no-files-found: warn
          retention-days: 7

  # The Docker ci stages only cover the two apps. @ft/shared and @ft/ui have
  # their own suites and thresholds, and they run natively: neither touches a
  # runtime the container image would change.
  package-tests:
    name: package tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run test:cov --filter="./packages/*"

  build:
    name: build
    needs: [ts-version, unit-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run build
