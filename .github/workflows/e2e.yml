name: e2e

# Runs Playwright against the PRODUCTION compose stack, never against a dev
# server. Two of these specs are subject rejection criteria and only mean
# something on a production build:
#
#   console gate  e2e/tests/console.spec.ts  zero console errors, zero console
#                 warnings, zero uncaught exceptions, zero failed requests on
#                 every route, including client-side navigation.
#   legal pages   e2e/tests/legal.spec.ts    /privacy and /terms answer 200 and
#                 render real content, measured against a character floor.
#
# Every spec runs on Chromium, Firefox and WebKit (the additional browsers
# minor), each browser as two jobs with a stack each: lesson.spec.ts alone is
# about half of the suite's time, so it is one part and every other spec the
# other (E2E_PART, see e2e/playwright.config.ts). Playwright's own --shard cuts
# by test count in file order, which put nearly every slow test in one half.
# The suite waits on POST /auth/signup, limited to 20 a minute per address, and
# each stack keeps its own count (e2e/support/signup-budget.ts). The gate at the
# end carries the check the ruleset requires.
# See ci.yml: once per PR, once when the squash merge lands on main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: playwright (${{ matrix.browser }}, ${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # A WebKit failure should not hide whether Chromium and Firefox pass.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        part: [lesson, rest]

    env:
      COMPOSE: docker compose -f compose.yml -f compose.prod.yml
      E2E_BASE_URL: https://localhost
      # compose.prod.yml requires this rather than inheriting the dev fallback,
      # so a real deploy cannot sign cookies with a secret published in this repo.
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters-long
      # compose.prod.yml requires these like SESSION_SECRET. make writes them
      # into .env locally; CI has no .env. The suite logs in with the password.
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-admin-password
      GRAFANA_SECRET_KEY: ci-only-grafana-secret-key
      E2E_PART: ${{ matrix.part }}
      # The checks of the stack itself run in one job, not six: the stack is
      # the same in every job, only the browser and the specs differ.
      STACK_CHECKS: ${{ matrix.browser == 'chromium' && matrix.part == 'rest' }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup

      # Playwright runs in its own image, which carries the browsers and their
      # system packages: nothing comes from the runner's apt mirror, which some
      # days took 20 minutes for WebKit's (scripts/playwright-in-image.sh).
      # Pulled before the stack comes up, so no container idles meanwhile;
      # --version also proves the image runs the mounted node_modules.
      - name: Pull the Playwright image
        run: ./scripts/playwright-in-image.sh --version

      # No .env file. Every value in compose.yml is ${VAR:-default} except
      # SESSION_SECRET and the Grafana keys, supplied above, so the stack comes
      # up with the committed defaults, which is what an evaluator gets on a
      # fresh clone via `make`.
      - name: Start the production stack
        run: $COMPOSE up -d --build --wait --wait-timeout 300

      # --wait only proves the containers report healthy. This proves Caddy is
      # routing to them, which is a different failure and a much clearer one to
      # read than a Playwright timeout.
      - name: Wait for the proxy to serve the app
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsSk -o /dev/null "$E2E_BASE_URL/healthz"; then
              echo "proxy answered after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::$E2E_BASE_URL/healthz never answered"
          exit 1

      # The database comes up empty. Until the browser suite signed up an
      # account, nothing here wrote a row and the missing tables went unnoticed.
      # The prod image carries no Prisma CLI or schema, so this runs from a
      # throwaway container built off the api build stage, exactly as `make` does.
      - name: Apply migrations
        id: migrate
        run: make db-ready

      # What test:e2e runs, with Playwright in its image.
      - name: Run the suite
        run: |
          pnpm --filter @ft/shared run build
          ./scripts/playwright-in-image.sh test --project=${{ matrix.browser }}

      # --wait proves the containers run. This proves Prometheus scrapes every
      # target, evaluates every rule and has found Alertmanager. After the
      # suite: by then every target has been scraped, so it passes at once
      # instead of waiting out a first scrape. Before the restart below, which
      # takes the API target down again. Also after a failed suite, so a flaky
      # test cannot hide a monitoring regression. A stack that never came up or
      # never migrated skips it: the check counts seeded rows.
      - name: Check the monitoring stack
        if: ${{ !cancelled() && env.STACK_CHECKS == 'true' && steps.migrate.outcome == 'success' }}
        run: ./scripts/check-monitoring.sh

      # Alone and after the suite: it restarts the API, which every test beside
      # it and SSR would lose. In one job only, on Chromium as test:e2e:restart
      # runs it: the retry loop is the same code on every engine. The spec calls
      # plain `docker compose`, so the job's file list goes in through
      # COMPOSE_FILE.
      - name: Restart the API under an open page
        if: env.STACK_CHECKS == 'true'
        run: ./scripts/playwright-in-image.sh test --project=chromium
        env:
          COMPOSE_FILE: compose.yml:compose.prod.yml
          E2E_RESTART: "1"

      # Container logs are the only way to tell an app bug from an
      # infrastructure one once the stack is gone.
      - name: Dump container logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 400

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          # One per job: a run refuses two artifacts of the same name.
          name: playwright-report-${{ matrix.browser }}-${{ matrix.part }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Tear the stack down
        if: always()
        run: $COMPOSE down -v --remove-orphans

  # The check the ruleset requires, whatever the browsers and parts. always(): a
  # job skipped by its `if` counts as passed, so the gate has to run, and fail,
  # when a job did not pass.
  playwright:
    name: playwright (production stack)
    needs: suite
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULT: ${{ needs.suite.result }}
        run: |
          echo "suite jobs: $RESULT"
          test "$RESULT" = success
