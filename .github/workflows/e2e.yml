name: e2e

# Runs Playwright against the PRODUCTION compose stack, never against a dev
# server. Two of these specs are subject rejection criteria and only mean
# something on a production build:
#
#   console gate  e2e/tests/console.spec.ts  zero console errors, zero console
#                 warnings, zero uncaught exceptions, zero failed requests on
#                 every route, including client-side navigation.
#   legal pages   e2e/tests/legal.spec.ts    /privacy and /terms answer 200 and
#                 render real content, measured against a character floor.
#
# Every spec runs on Chromium, Firefox and WebKit (the additional browsers
# minor), one job and one stack per browser. The suite waits on POST
# /auth/signup, limited to 10 a minute per address, and each stack keeps its own
# count (e2e/support/signup-budget.ts): on one stack the three browsers queued
# for the same budget. The gate at the end carries the check the ruleset requires.
# See ci.yml: once per PR, once when the squash merge lands on main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: playwright (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # A WebKit failure should not hide whether Chromium and Firefox pass.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    env:
      COMPOSE: docker compose -f compose.yml -f compose.prod.yml
      E2E_BASE_URL: https://localhost
      # compose.prod.yml requires this rather than inheriting the dev fallback,
      # so a real deploy cannot sign cookies with a secret published in this repo.
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters-long
      # compose.prod.yml requires these like SESSION_SECRET. make writes them
      # into .env locally; CI has no .env. The suite logs in with the password.
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-admin-password
      GRAFANA_SECRET_KEY: ci-only-grafana-secret-key

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup

      # Before the stack comes up: this step is cache-friendly and slow, and
      # there is no reason to have containers idling while it runs.
      - name: Install the browser build Playwright pins
        run: pnpm --filter @ft/e2e exec playwright install --with-deps ${{ matrix.browser }}

      # No .env file. Every value in compose.yml is ${VAR:-default} except
      # SESSION_SECRET and the Grafana keys, supplied above, so the stack comes
      # up with the committed defaults, which is what an evaluator gets on a
      # fresh clone via `make`.
      - name: Start the production stack
        run: $COMPOSE up -d --build --wait --wait-timeout 300

      # --wait only proves the containers report healthy. This proves Caddy is
      # routing to them, which is a different failure and a much clearer one to
      # read than a Playwright timeout.
      - name: Wait for the proxy to serve the app
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsSk -o /dev/null "$E2E_BASE_URL/healthz"; then
              echo "proxy answered after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::$E2E_BASE_URL/healthz never answered"
          exit 1

      # The database comes up empty. Until the browser suite signed up an
      # account, nothing here wrote a row and the missing tables went unnoticed.
      # The prod image carries no Prisma CLI or schema, so this runs from a
      # throwaway container built off the api build stage, exactly as `make` does.
      - name: Apply migrations
        run: make db-ready

      # --wait proves the containers run. This proves Prometheus scrapes every
      # target, evaluates every rule and has found Alertmanager. After the
      # migrations, so the API's bank gauge has seeded rows to count.
      - name: Check the monitoring stack
        run: ./scripts/check-monitoring.sh

      - name: Run the suite
        run: pnpm --filter @ft/e2e run test:e2e --project=${{ matrix.browser }}

      # Alone and after the suite: it restarts the API, which every test beside
      # it and SSR would lose. In Chromium's job only: test:e2e:restart pins
      # Chromium, and the retry loop is the same code on every engine. The spec
      # calls plain `docker compose`, so the job's file list goes in through
      # COMPOSE_FILE.
      - name: Restart the API under an open page
        if: matrix.browser == 'chromium'
        run: pnpm --filter @ft/e2e run test:e2e:restart
        env:
          COMPOSE_FILE: compose.yml:compose.prod.yml

      # Container logs are the only way to tell an app bug from an
      # infrastructure one once the stack is gone.
      - name: Dump container logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 400

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          # One per browser: a run refuses two artifacts of the same name.
          name: playwright-report-${{ matrix.browser }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Tear the stack down
        if: always()
        run: $COMPOSE down -v --remove-orphans

  # The check the ruleset requires, whatever the browser list. always(): a job
  # skipped by its `if` counts as passed, so the gate has to run, and fail,
  # when a browser did not pass.
  playwright:
    name: playwright (production stack)
    needs: suite
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every browser passed
        env:
          RESULT: ${{ needs.suite.result }}
        run: |
          echo "browser jobs: $RESULT"
          test "$RESULT" = success
