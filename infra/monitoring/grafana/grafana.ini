# Baked into the image, so dev, CI and the server run the same security
# settings. Per-host values come from the environment: GF_SERVER_ROOT_URL,
# GF_SECURITY_ADMIN_PASSWORD, GF_SECURITY_SECRET_KEY (compose files).

[server]
# Caddy forwards /grafana with the prefix intact, like /api.
serve_from_sub_path = true
root_url = https://localhost/grafana/
# Several dev host names (localhost, caddy, the .test name) reach one instance.
enforce_domain = false

[security]
admin_user = admin
# TLS ends at Caddy; the browser only ever talks https.
cookie_secure = true
# lax, not strict: a link from a Discord alert should open logged in. Grafana
# also checks Origin against Host on every state-changing request.
cookie_samesite = lax
disable_gravatar = true
# Lockout after 5 failures in 5 minutes, per client IP only: per user name,
# anyone could keep the one admin account locked, and its 192-bit password
# makes that lockout pointless. The IP is trustworthy because Caddy
# overwrites X-Real-IP (Caddyfile).
disable_brute_force_login_protection = false
brute_force_login_protection_max_attempts = 5
disable_username_login_protection = true
disable_ip_address_login_protection = false
allow_embedding = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org_role = Viewer

[auth]
# An admin console: a day idle logs out, a week at most.
login_maximum_inactive_lifetime_duration = 1d
login_maximum_lifetime_duration = 7d

[auth.anonymous]
enabled = false

[public_dashboards]
# On by default, and a public dashboard needs no login.
enabled = false

[snapshots]
# A snapshot link is readable without login, and external ones go to raintank.io.
enabled = false
external_enabled = false

[metrics]
# No auth on it, and it would be public at /grafana/metrics. Caddy refuses
# the path as well.
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[plugins]
# Grafana starts every bundled datasource with a backend as its own process,
# about 20 to 30 MB each. Only prometheus is used (alertmanager runs in
# process), so the other twelve stay off: measured 240 -> 180 MiB.
disable_plugins = elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin
# The image is the source of truth: no installs from the UI, and none of the
# apps Grafana otherwise downloads from grafana.com at startup.
plugin_admin_enabled = false
preinstall_disabled = true
preinstall_auto_update = false

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/overview.json
# Stops a 5s auto-refresh from loading a shared-core server.
min_refresh_interval = 30s

[log]
mode = console
