# Scrape and alerting config, baked into the image built from this directory.
# Every target is a compose service on the ft network: none is reachable from
# outside, so none needs auth. Checked by scripts/check-monitoring-config.sh.

global:
  # 30s rather than the usual 15s: the server is a shared-core box and nothing
  # here needs finer resolution. Grafana's datasource timeInterval matches.
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

storage:
  tsdb:
    # Here, not as flags: the retention flags are deprecated in 3.x. Whichever
    # limit is reached first applies.
    retention:
      time: 15d
      size: 1GB

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # The api's metrics listener (apps/api/src/metrics/metrics-server.ts), not
  # its public port 3001: caddy never routes here.
  - job_name: api
    static_configs:
      - targets: ["api:9464"]

  # The :2020 site in infra/caddy/Caddyfile, not the admin API on :2019.
  - job_name: caddy
    static_configs:
      - targets: ["caddy:2020"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # web has no metrics endpoint (any web route would be public through caddy's
  # catch-all), so it is probed from outside its process instead.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://web:3000/healthz
          - http://web:3000/healthz/upstream
          - http://grafana:3000/grafana/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
